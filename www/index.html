<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#090b0e" />
  <title>study_matters</title>
  <style>
    :root, [data-theme="dark"] {
      --bg: #090b0e;
      --surface: #11161d;
      --surface-2: #18202a;
      --border: #24303f;
      --text: #f1f5f9;
      --muted: #8b9bb0;
      --accent: #10b981;
      --accent-2: #34d399;
      --accent-soft: rgba(16, 185, 129, 0.14);
      --danger: #f43f5e;
      --danger-soft: rgba(244, 63, 94, 0.14);
      --warn: #f59e0b;
      --tree-0: #161d26;
      --tree-1: #064e3b;
      --tree-2: #047857;
      --tree-3: #10b981;
      --tree-4: #34d399;
    }
    [data-theme="light"] {
      --bg: #f6f5f2;
      --surface: #ffffff;
      --surface-2: #efede7;
      --border: #e1ddd3;
      --text: #13171c;
      --muted: #646d78;
      --accent: #059669;
      --accent-2: #10b981;
      --accent-soft: rgba(5, 150, 105, 0.12);
      --danger: #e11d48;
      --danger-soft: rgba(225, 29, 72, 0.12);
      --warn: #d97706;
      --tree-0: #e7e4dc;
      --tree-1: #a7f3d0;
      --tree-2: #34d399;
      --tree-3: #059669;
      --tree-4: #064e3b;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0;
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
    }
    body {
      padding-top: env(safe-area-inset-top, 12px);
      padding-bottom: calc(84px + env(safe-area-inset-bottom, 12px));
    }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .app { max-width: 480px; margin: 0 auto; padding: 14px 16px; }

    /* Header */
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 14px;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .logo {
      width: 34px; height: 34px; border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), #047857);
      display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 15px;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.28);
    }
    .brand-title { font-weight: 700; font-size: 17px; letter-spacing: -0.3px; }
    .brand-sub { font-size: 11px; color: var(--muted); }
    .top-actions { display: flex; gap: 8px; }
    .icon-btn {
      width: 36px; height: 36px; border-radius: 10px;
      border: 1px solid var(--border); background: var(--surface); color: var(--text);
      display: grid; place-items: center; cursor: pointer; position: relative;
    }
    .badge-dot {
      position: absolute; top: 7px; right: 7px; width: 7px; height: 7px;
      border-radius: 50%; background: var(--accent);
    }

    /* Cards */
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 18px; padding: 16px; margin-bottom: 14px;
    }
    .card-head {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 12px;
    }
    .card-title { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.6px; }

    /* Reminder Banner */
    .banner {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      background: var(--accent-soft); border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 14px; padding: 11px 14px; margin-bottom: 14px; font-size: 13px;
    }
    .banner strong { color: var(--accent-2); }

    /* Progress Ring */
    .hero { display: flex; align-items: center; gap: 18px; }
    .ring-wrap { position: relative; width: 122px; height: 122px; flex-shrink: 0; }
    .ring-wrap svg { transform: rotate(-90deg); width: 122px; height: 122px; }
    .ring-bg { fill: none; stroke: var(--surface-2); stroke-width: 10; }
    .ring-fg { fill: none; stroke: var(--accent); stroke-width: 10; stroke-linecap: round; transition: stroke-dashoffset 0.35s ease; }
    .ring-center {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center;
    }
    .ring-pct { font-size: 22px; font-weight: 800; }
    .ring-lbl { font-size: 11px; color: var(--muted); }
    .hero-stats { flex: 1; }
    .hero-hours { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; }
    .hero-goal {
      display: inline-flex; align-items: center; gap: 6px;
      margin-top: 4px; padding: 5px 10px; border-radius: 8px;
      background: var(--surface-2); border: 1px solid var(--border);
      color: var(--text); font-size: 12px; font-weight: 600; cursor: pointer;
    }
    .hero-rem { margin-top: 8px; font-size: 12px; color: var(--muted); line-height: 1.4; }

    /* Stopwatch */
    .sw-display {
      font-size: 34px; font-weight: 800; text-align: center;
      padding: 10px 0 12px; letter-spacing: 1px; color: var(--text);
    }
    .sw-running { color: var(--accent-2); }
    .sw-controls { display: grid; grid-template-columns: 1fr 1fr 1.2fr; gap: 8px; }
    .btn {
      border: 1px solid var(--border); background: var(--surface-2); color: var(--text);
      border-radius: 12px; padding: 10px 12px; font-size: 13px; font-weight: 600;
      cursor: pointer; text-align: center;
    }
    .btn:active { transform: scale(0.98); }
    .btn-primary { background: var(--accent); border-color: var(--accent); color: #042f2e; font-weight: 700; }
    .btn-danger { background: var(--danger-soft); border-color: rgba(244,63,94,0.35); color: var(--danger); }
    .btn-add { background: var(--accent-soft); border-color: rgba(16,185,129,0.35); color: var(--accent-2); }

    /* Quick Adjust Grid */
    .chip
